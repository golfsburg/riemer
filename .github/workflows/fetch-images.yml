name: Bilder ins Repo laden

on:
  push:
    paths:
      - 'tools/images.json'
      - 'tools/fetch_images.py'
      - '.github/workflows/fetch-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bilder herunterladen
        run: python tools/fetch_images.py
      - name: Committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898280+github-actions[bot]@users.noreply.github.com"
          git add img
          if git diff --cached --quiet; then
            echo "Keine neuen Bilder."
          else
            git commit -m "Bilder ins Repo geladen (automatisch)"
            git push
          fi
